name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Sign and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        shell: bash
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version." >&2
            exit 1
          fi

      - name: Validate and build
        run: npm run build

      - name: Sign with Mozilla
        shell: bash
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$AMO_JWT_ISSUER"
          test -n "$AMO_JWT_SECRET"
          npm exec -- web-ext sign \
            --source-dir extension \
            --artifacts-dir dist/signed \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --no-input \
            --timeout 300000 \
            --approval-timeout 900000

          version=$(node -p "require('./extension/manifest.json').version")
          signed=$(find dist/signed -maxdepth 1 -type f -name '*.xpi' -print -quit)
          test -n "$signed"
          mv "$signed" "dist/youtube_without_ai-$version-signed.xpi"
          cp "dist/youtube_without_ai-$version-signed.xpi" dist/youtube_without_ai-firefox.xpi
          rm -rf dist/signed

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum youtube_without_ai-*.zip youtube_without_ai-*.xpi > SHA256SUMS.txt

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          gh release create "$GITHUB_REF_NAME" \
            "dist/youtube_without_ai-$version.zip" \
            "dist/youtube_without_ai-$version-signed.xpi" \
            dist/youtube_without_ai-firefox.xpi \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "YouTube Without AI $version"
